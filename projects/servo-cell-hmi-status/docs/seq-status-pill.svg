<svg xmlns="http://www.w3.org/2000/svg" width="900" height="212" viewBox="0 0 900 212" role="img"
     aria-label="Seq_Status multistate indicator: five states rendered as pills.">
  <rect width="900" height="212" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="28" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">
    Seq_Status &#8212; multistate indicator states (FactoryTalk View ME v16)
  </text>

  <!-- State 0 STOPPED -->
  <rect x="28" y="60" width="150" height="52" rx="26" fill="#595959"/>
  <text x="103" y="93" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">STOPPED</text>
  <text x="103" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1f2328">State 0</text>
  <text x="103" y="154" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#57606a">#595959</text>
  <text x="103" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">idle or manual</text>

  <!-- State 1 RUNNING -->
  <rect x="198" y="60" width="150" height="52" rx="26" fill="#00783C"/>
  <text x="273" y="93" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">RUNNING</text>
  <text x="273" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1f2328">State 1</text>
  <text x="273" y="154" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#57606a">#00783C</text>
  <text x="273" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">steps 2&#8211;11</text>

  <!-- State 2 HOLDING -->
  <rect x="368" y="60" width="150" height="52" rx="26" fill="#FFC000"/>
  <text x="443" y="93" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="700" fill="#000000" letter-spacing="1.2">HOLDING</text>
  <text x="443" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1f2328">State 2</text>
  <text x="443" y="154" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#57606a">#FFC000</text>
  <text x="443" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">step 1 or 99</text>

  <!-- State 3 FAULTED -->
  <rect x="538" y="60" width="150" height="52" rx="26" fill="#C00000"/>
  <text x="613" y="93" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="18" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">FAULTED</text>
  <text x="613" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1f2328">State 3</text>
  <text x="613" y="154" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#57606a">#C00000</text>
  <text x="613" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">drive or cmd fault</text>

  <!-- Error state -->
  <rect x="708" y="60" width="164" height="52" rx="26" fill="#000000" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="790" y="93" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="1.1">COMM ERROR</text>
  <text x="790" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1f2328">Error state</text>
  <text x="790" y="154" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#57606a">#000000 + blink</text>
  <text x="790" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">tag unreadable</text>

  <line x1="694" y1="56" x2="694" y2="186" stroke="#d0d7de" stroke-width="1"/>
  <text x="28" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#57606a">
    Caption text carries the state, not the color &#8212; the pill is still readable in greyscale and to a red/green colour-blind operator.
  </text>
</svg>
